<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Demandas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📋 Gestão de Demandas</h1>
      <span class="subtitle">via WhatsApp</span>
    </div>
  </header>

  <nav class="nav-tabs">
    <a href="/" class="nav-tab active" id="nav-dashboard">Dashboard</a>
    <a href="/calendario.html" class="nav-tab" id="nav-calendario">📅 Calendário</a>
    <a href="/hoje.html" class="nav-tab" id="nav-hoje">☀️ Hoje</a>
    <a href="/atividades.html" class="nav-tab" id="nav-atividades">🗒️ Atividades</a>
    <a href="/atividades-gestao.html" class="nav-tab" id="nav-gestao-atividades" style="display:none">✅ Gestão de Atividades</a>
    <a href="/configuracoes.html" class="nav-tab" id="nav-config">⚙️ Configurações</a>
    <a href="/admin.html" class="nav-tab" id="nav-admin" style="display:none">👥 Admin</a>
  </nav>

  <main>
    <!-- Stats -->
    <section class="stats" id="stats">
      <div class="stat-card"><span id="total-demandas">—</span><label>Total Ativas</label></div>
      <div class="stat-card"><span id="pendentes">—</span><label>Aguardando Aceite</label></div>
      <div class="stat-card"><span id="em-andamento">—</span><label>Em Andamento</label></div>
      <div class="stat-card"><span id="aguardando-baixa">—</span><label>Aguardando Baixa</label></div>
      <div class="stat-card vencida"><span id="vencidas">—</span><label>Vencidas</label></div>
    </section>

    <!-- Visão por Usuário -->
    <section id="usuarios-overview" style="margin-bottom:20px"></section>

    <div class="layout">
      <!-- Painel esquerdo: formulário + usuários -->
      <aside class="sidebar">
        <section class="card">
          <h2>Nova Demanda</h2>
          <form id="form-demanda">
            <label>Solicitante
              <select id="solicitante" required></select>
            </label>
            <label>Responsável
              <select id="responsavel" required></select>
            </label>
            <label>Descrição
              <textarea id="descricao" rows="3" required placeholder="Descreva a tarefa..."></textarea>
            </label>
            <label>Data de Entrega
              <input type="date" id="data-entrega" required />
            </label>
            <label>Horário de Entrega <span style="font-weight:400;color:var(--text-muted)">(opcional)</span>
              <input type="time" id="horario-entrega" />
            </label>
            <button type="submit" class="btn-primary">Criar Demanda</button>
          </form>
          <div id="form-msg" class="form-msg"></div>
        </section>

        <section class="card">
          <h2>Usuários Cadastrados</h2>
          <ul id="lista-usuarios" class="user-list"></ul>
          <details style="margin-top:12px">
            <summary>Adicionar Usuário</summary>
            <form id="form-usuario">
              <label>Nome <input type="text" id="u-nome" required /></label>
              <label>Telefone (com DDI) <input type="text" id="u-telefone" placeholder="+5511999990001" required /></label>
              <label>Email <input type="email" id="u-email" placeholder="usuario@empresa.com" /></label>
              <label>Canal
                <select id="u-canal">
                  <option value="whatsapp">💬 WhatsApp</option>
                  <option value="email">📧 Email</option>
                  <option value="ambos">💬📧 Ambos</option>
                </select>
              </label>
              <button type="submit" class="btn-secondary">Adicionar</button>
            </form>
            <div id="form-usuario-msg" class="form-msg"></div>
          </details>
        </section>
      </aside>

      <!-- Painel principal: lista de demandas -->
      <section class="main-panel">
        <div class="filter-bar">
          <label>Status:
            <select id="filtro-status">
              <option value="">Todos (exceto finalizados)</option>
              <option value="pendente_aceite">Aguardando Aceite</option>
              <option value="em_negociacao">Em Negociação</option>
              <option value="aceita">Aceita</option>
              <option value="em_andamento">Em Andamento</option>
              <option value="concluida_aguardando_baixa">Aguardando Baixa</option>
              <option value="finalizada">Finalizada</option>
            </select>
          </label>
          <label>Usuário:
            <select id="filtro-usuario">
              <option value="">Todos</option>
            </select>
          </label>
          <button class="btn-icon" id="btn-refresh" title="Atualizar">↻</button>
          <button class="btn-enviar-relatorio" id="btn-enviar-relatorio" title="Enviar relatório agora">📨 Enviar Relatório Agora</button>
          <span id="proximo-relatorio" class="proximo-relatorio-badge"></span>
        </div>

        <div id="lista-demandas"></div>
      </section>
    </div>

    <!-- Modal de edição de usuário -->
    <div id="modal-usuario" class="modal hidden">
      <div class="modal-content" style="max-width:400px">
        <button class="modal-close" onclick="document.getElementById('modal-usuario').classList.add('hidden')">✕</button>
        <h2 style="margin-bottom:16px;color:var(--accent)">Editar Usuário</h2>
        <form id="form-editar-usuario">
          <input type="hidden" id="edit-usuario-id" />
          <label>Nome
            <input type="text" id="edit-usuario-nome" required />
          </label>
          <label style="margin-top:10px">Telefone (com DDI)
            <input type="text" id="edit-usuario-telefone" placeholder="+5511999990001" required />
          </label>
          <div style="display:flex;gap:8px;margin-top:14px">
            <button type="submit" class="btn-primary" style="flex:1">Salvar</button>
            <button type="button" class="btn-secondary" onclick="document.getElementById('modal-usuario').classList.add('hidden')">Cancelar</button>
          </div>
          <div id="edit-usuario-msg" class="form-msg"></div>
        </form>
      </div>
    </div>

    <!-- Modal de stats por usuário -->
    <div id="modal-stats" class="modal hidden">
      <div class="modal-content" style="max-width:520px">
        <button class="modal-close" id="modal-stats-close">✕</button>
        <div id="modal-stats-body"></div>
      </div>
    </div>

    <!-- Modal de detalhes -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="modal-close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
