<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoje — Gestão de Demandas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .filter-bar label { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-muted); font-weight: 600; }
    .filter-bar select { padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: .85rem; font-family: inherit; }
    .section-title { font-size: 1rem; font-weight: 700; color: var(--text); margin: 28px 0 14px; display: flex; align-items: center; gap: 8px; }
    .section-title .count { font-size: .75rem; background: var(--surface-3); color: var(--text-muted); padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .empty-msg { color: var(--text-muted); font-size: .88rem; padding: 20px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .demanda-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
    .demanda-card:hover { border-color: var(--accent); }
    .demanda-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .demanda-descricao { font-weight: 600; font-size: .92rem; color: var(--text); line-height: 1.4; }
    .demanda-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
    .demanda-meta { font-size: .8rem; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .badge-pendente_aceite { background: rgba(245,158,11,.15); color: var(--warning); }
    .badge-em_negociacao   { background: rgba(139,92,246,.15); color: var(--purple); }
    .badge-aceita, .badge-em_andamento { background: rgba(34,197,94,.15); color: var(--success); }
    .badge-concluida_aguardando_baixa { background: rgba(79,142,247,.15); color: var(--accent); }
    .badge-finalizada { background: rgba(74,74,74,.2); color: var(--text-muted); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .modal.hidden { display: none; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 28px 24px; width: 100%; max-width: 620px; position: relative; max-height: 88vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .modal-section { margin-top: 18px; }
    .modal-section h3 { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 10px; }
    .timeline { list-style: none; border-left: 1px solid var(--border); padding-left: 16px; }
    .timeline li { position: relative; padding: 0 0 14px; font-size: .85rem; }
    .timeline li::before { content: ''; position: absolute; left: -20px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface-4); border: 1.5px solid var(--border); }
    .timeline .msg-tipo { font-weight: 600; color: var(--text-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
    .timeline .msg-data { color: var(--text-faint, #4a4a4a); font-size: .72rem; margin-left: 6px; }
    .timeline .msg-texto { margin-top: 4px; color: var(--text); white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📋 Gestão de Demandas</h1>
      <span class="subtitle">via WhatsApp</span>
    </div>
  </header>

  <nav class="nav-tabs">
    <a href="/" class="nav-tab" id="nav-dashboard">Dashboard</a>
    <a href="/calendario.html" class="nav-tab">📅 Calendário</a>
    <a href="/hoje.html" class="nav-tab active">☀️ Hoje</a>
    <a href="/configuracoes.html" class="nav-tab">⚙️ Configurações</a>
    <a href="/admin.html" class="nav-tab" id="nav-admin" style="display:none">👥 Admin</a>
  </nav>

  <main>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 id="hoje-titulo" style="font-size:1.2rem;font-weight:800;margin:0"></h2>
        <div id="hoje-subtitulo" style="font-size:.82rem;color:var(--text-muted);margin-top:2px"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <label style="font-size:.82rem;color:var(--text-muted);font-weight:600;display:flex;align-items:center;gap:6px">Pessoa:
          <select id="filtro-usuario" style="padding:7px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.85rem;font-family:inherit">
            <option value="">Todos</option>
          </select>
        </label>
        <button onclick="carregar()" style="padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text);cursor:pointer;font-size:.85rem">↻</button>
      </div>
    </div>

    <div class="hoje-stats" id="hoje-stats"></div>

    <div class="section-title">📅 Entregas de Hoje <span class="count" id="count-hoje">0</span></div>
    <div id="lista-hoje"></div>

    <div class="section-title" style="color:var(--danger)">🔴 Atrasadas <span class="count" id="count-atrasadas">0</span></div>
    <div id="lista-atrasadas"></div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const auth = JSON.parse(localStorage.getItem('gestao_auth') || 'null');
    if (!auth?.token) location.href = '/login.html';
    const H = { 'Authorization': 'Bearer ' + auth.token, 'Content-Type': 'application/json' };
    if (auth.usuario?.perfil === 'admin') document.getElementById('nav-admin').style.display = '';

    const hoje = new Date().toISOString().slice(0, 10);
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const dh = new Date();
    document.getElementById('hoje-titulo').textContent = `☀️ ${dh.getDate()} de ${meses[dh.getMonth()]} de ${dh.getFullYear()}`;

    let todasDemandas = [], todosUsuarios = [];

    const statusLabel = s => ({ pendente_aceite:'Aguardando Aceite', em_negociacao:'Em Negociação', aceita:'Aceita', em_andamento:'Em Andamento', concluida_aguardando_baixa:'Ag. Baixa', finalizada:'Finalizada' }[s] || s);
    const fmtDate = iso => { if(!iso) return '—'; const [y,m,d] = iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
    const prazoD = d => d.data_acordada || d.data_entrega;

    function cardHTML(d) {
      return `<div class="demanda-card" onclick="abrirModal('${d.id}')">
        <div class="demanda-header">
          <div class="demanda-descricao"><span class="demanda-codigo">${d.codigo||''}</span>${d.descricao}</div>
          <span class="demanda-badge badge-${d.status}">${statusLabel(d.status)}</span>
        </div>
        <div class="demanda-meta">
          <span>👤 ${d.solicitante?.nome||'—'} → ${d.responsavel?.nome||'—'}</span>
          <span>📅 ${fmtDate(prazoD(d))}</span>
        </div>
      </div>`;
    }

    function renderGrupos(lista, containerId) {
      const el = document.getElementById(containerId);
      if (!lista.length) { el.innerHTML = '<div class="empty-msg">Nenhuma atividade.</div>'; return; }
      const grupos = {};
      lista.forEach(d => { const n = d.responsavel?.nome||'Sem responsável'; if(!grupos[n]) grupos[n]=[]; grupos[n].push(d); });
      el.innerHTML = Object.entries(grupos).map(([nome, items]) => `
        <div class="grupo-pessoa">
          <div class="grupo-pessoa-header">
            <div class="grupo-avatar">${nome[0].toUpperCase()}</div>
            <span class="grupo-nome">${nome}</span>
            <span class="grupo-count">${items.length} atividade${items.length>1?'s':''}</span>
          </div>
          ${items.map(cardHTML).join('')}
        </div>`).join('');
    }

    function aplicarFiltro() {
      const uid = document.getElementById('filtro-usuario').value;
      const ativas = todasDemandas.filter(d => d.status !== 'finalizada');
      const filtrar = l => uid ? l.filter(d => d.solicitante_id===uid || d.responsavel_id===uid) : l;

      const deHoje = filtrar(ativas.filter(d => prazoD(d)?.slice(0,10) === hoje));
      const atrasadas = filtrar(ativas.filter(d => {
        const p = prazoD(d)?.slice(0,10);
        return p && p < hoje && !['concluida_aguardando_baixa'].includes(d.status);
      }));

      document.getElementById('count-hoje').textContent = deHoje.length;
      document.getElementById('count-atrasadas').textContent = atrasadas.length;
      renderGrupos(deHoje, 'lista-hoje');
      renderGrupos(atrasadas, 'lista-atrasadas');

      const todas = filtrar(ativas);
      document.getElementById('hoje-subtitulo').textContent = `${todas.length} atividades ativas`;
      document.getElementById('hoje-stats').innerHTML = `
        <div class="hoje-stat accent"><div class="hoje-stat-num">${deHoje.length}</div><div class="hoje-stat-label">Entregam Hoje</div></div>
        <div class="hoje-stat danger"><div class="hoje-stat-num">${atrasadas.length}</div><div class="hoje-stat-label">Atrasadas</div></div>
        <div class="hoje-stat warn"><div class="hoje-stat-num">${todas.filter(d=>d.status==='pendente_aceite').length}</div><div class="hoje-stat-label">Ag. Aceite</div></div>
        <div class="hoje-stat"><div class="hoje-stat-num">${todas.filter(d=>['aceita','em_andamento'].includes(d.status)).length}</div><div class="hoje-stat-label">Em Andamento</div></div>`;
    }

    async function carregar() {
      const [rD, rU] = await Promise.all([
        fetch('/api/demandas?todos=true', { headers: H }),
        fetch('/api/usuarios', { headers: H })
      ]);
      todasDemandas = await rD.json();
      todosUsuarios = await rU.json();
      const sel = document.getElementById('filtro-usuario');
      const prev = sel.value;
      sel.innerHTML = '<option value="">Todos</option>' + todosUsuarios.map(u=>`<option value="${u.id}">${u.nome}</option>`).join('');
      if (prev) sel.value = prev;
      aplicarFiltro();
    }

    document.getElementById('filtro-usuario').addEventListener('change', aplicarFiltro);
    document.getElementById('modal-close').onclick = () => document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').onclick = e => { if(e.target===document.getElementById('modal')) document.getElementById('modal').classList.add('hidden'); };

    async function abrirModal(id) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modal-body');
      modal.classList.remove('hidden');
      body.innerHTML = '<p style="color:var(--text-muted)">Carregando...</p>';
      try {
        const [rD, rM] = await Promise.all([
          fetch(`/api/demandas/${id}`, { headers: H }),
          fetch(`/api/demandas/${id}/mensagens`, { headers: H })
        ]);
        const d = await rD.json();
        const msgs = rM.ok ? await rM.json() : [];
        const tipoLabel = { criacao:'📋 Criação', resposta:'💬 Resposta', aceite:'✅ Aceite', baixa:'✔️ Baixa', reagendamento:'📅 Reagendamento', conclusao:'🎉 Conclusão' };
        body.innerHTML = `
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
            <div class="modal-title"><span class="demanda-codigo">${d.codigo||''}</span>${d.descricao}</div>
            <span class="demanda-badge badge-${d.status}">${statusLabel(d.status)}</span>
          </div>
          <div class="modal-section"><h3>Detalhes</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.85rem">
              <div><span style="color:var(--text-muted)">Solicitante</span><br>${d.solicitante?.nome||'—'}</div>
              <div><span style="color:var(--text-muted)">Responsável</span><br>${d.responsavel?.nome||'—'}</div>
              <div><span style="color:var(--text-muted)">Prazo</span><br>${fmtDate(d.data_acordada||d.data_entrega)}${d.horario_entrega?' às '+d.horario_entrega:''}</div>
              <div><span style="color:var(--text-muted)">Origem</span><br>${d.origem||'web'}</div>
            </div>
          </div>
          <div class="modal-section"><h3>Histórico</h3>
            ${!msgs.length ? '<p style="color:var(--text-muted);font-size:.85rem">Sem mensagens.</p>'
              : '<ul class="timeline">'+msgs.map(m=>`<li><span class="msg-tipo">${tipoLabel[m.tipo]||m.tipo}</span><span class="msg-data">${fmtDate(m.enviado_em)}</span><div class="msg-texto">${m.conteudo}</div></li>`).join('')+'</ul>'}
          </div>`;
      } catch(e) { body.innerHTML = `<p style="color:var(--danger)">Erro: ${e.message}</p>`; }
    }

    carregar();
    setInterval(carregar, 60000);
  </script>
</body>
</html>
