<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparador de Supermercado</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ── layout ── */
    .page { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
    .two-col { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
    @media(max-width:700px){ .two-col { grid-template-columns:1fr; } }

    /* ── cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
    .card h2 { font-size:.95rem; font-weight:600; margin-bottom:14px; color:var(--text); }
    .card-sm { background: var(--surface-2); border: 1px solid var(--border-light); border-radius: var(--radius); padding:14px; margin-bottom:10px; }

    /* ── form ── */
    .field { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
    .field label { font-size:.75rem; color:var(--text-muted); font-weight:500; }
    .field input, .field select { background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; color:var(--text); font-size:.875rem; outline:none; }
    .field input:focus, .field select:focus { border-color:var(--accent); }
    .row-fields { display:grid; grid-template-columns:1fr 80px 70px; gap:8px; }
    .row-fields .field { margin-bottom:0; }

    /* ── botões ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius); font-size:.84rem; font-weight:500; border:none; cursor:pointer; transition:.15s; }
    .btn-primary { background:var(--accent); color:#fff; width:100%; justify-content:center; }
    .btn-primary:hover { background:var(--accent-hover); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--surface-3); color:var(--text); }
    .btn-danger { background:transparent; color:var(--danger); border:none; padding:4px 8px; font-size:.8rem; }
    .btn-danger:hover { background:rgba(239,68,68,.1); }
    .btn-sm { padding:5px 10px; font-size:.78rem; }
    .btn-compare { background:linear-gradient(135deg,#f97316,#ef4444); color:#fff; width:100%; justify-content:center; padding:11px; font-size:.9rem; margin-top:6px; }
    .btn-compare:hover { opacity:.9; }
    .btn-compare:disabled { opacity:.5; cursor:not-allowed; }

    /* ── lista de itens ── */
    .items-list { display:flex; flex-direction:column; gap:6px; min-height:40px; margin:12px 0; }
    .item-row { display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-light); border-radius:var(--radius); padding:8px 10px; }
    .item-row .item-name { flex:1; font-size:.85rem; }
    .item-row .item-qty { color:var(--text-muted); font-size:.78rem; white-space:nowrap; }
    .item-row .item-obs { font-size:.73rem; color:var(--text-faint); }
    .empty-msg { color:var(--text-faint); font-size:.83rem; text-align:center; padding:16px; }

    /* ── listas salvas ── */
    .lista-tab { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:var(--radius); cursor:pointer; transition:.12s; border:1px solid transparent; }
    .lista-tab:hover { background:var(--surface-2); }
    .lista-tab.active { background:var(--surface-3); border-color:var(--accent); }
    .lista-tab .lt-name { font-size:.88rem; font-weight:500; flex:1; }
    .lista-tab .lt-count { font-size:.75rem; color:var(--text-muted); }

    /* ── resultado ── */
    #resultado { margin-top:20px; }
    .recomendacao { border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:16px; }
    .recomendacao.ifood { background:rgba(234,67,53,.08); border:1px solid rgba(234,67,53,.25); }
    .recomendacao.rappi { background:rgba(255,130,0,.08); border:1px solid rgba(255,130,0,.25); }
    .recomendacao.misto { background:rgba(79,142,247,.08); border:1px solid rgba(79,142,247,.25); }
    .recomendacao.aviso { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); }
    .recomendacao-titulo { font-size:.8rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:4px; }
    .recomendacao-msg { font-size:.95rem; font-weight:500; }
    .economia-badge { display:inline-block; background:var(--success); color:#fff; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:20px; margin-top:6px; }

    /* ── tabela de cenários ── */
    .cenarios { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-bottom:20px; }
    .cenario-card { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; position:relative; }
    .cenario-card.melhor { border-color:var(--success); background:rgba(34,197,94,.06); }
    .cenario-card .plat-badge { font-size:.7rem; font-weight:600; padding:2px 8px; border-radius:20px; display:inline-block; margin-bottom:6px; }
    .badge-ifood { background:rgba(234,67,53,.15); color:#ea4335; }
    .badge-rappi { background:rgba(255,130,0,.15); color:#ff8200; }
    .badge-misto { background:rgba(79,142,247,.15); color:#4f8ef7; }
    .cenario-card .cenario-nome { font-size:.82rem; color:var(--text-muted); margin-bottom:8px; }
    .cenario-card .cenario-total { font-size:1.5rem; font-weight:700; }
    .cenario-card .cenario-sub { font-size:.75rem; color:var(--text-muted); margin-top:2px; }
    .cenario-card .melhor-tag { position:absolute; top:-8px; right:10px; background:var(--success); color:#fff; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; }

    /* ── tabela de itens por loja ── */
    .loja-section { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:12px; overflow:hidden; }
    .loja-header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--surface-3); border-bottom:1px solid var(--border); cursor:pointer; }
    .loja-header .loja-nome { font-weight:600; font-size:.9rem; flex:1; }
    .loja-header .loja-total { font-weight:700; font-size:1rem; }
    .loja-header .loja-entrega { font-size:.75rem; color:var(--text-muted); }
    .itens-table { width:100%; border-collapse:collapse; font-size:.83rem; }
    .itens-table th { padding:8px 14px; text-align:left; color:var(--text-muted); font-weight:500; font-size:.75rem; border-bottom:1px solid var(--border-light); }
    .itens-table td { padding:9px 14px; border-bottom:1px solid var(--border-light); }
    .itens-table tr:last-child td { border-bottom:none; }
    .price-best { color:var(--success); font-weight:600; }
    .not-found { color:var(--text-faint); font-style:italic; }
    .check { color:var(--success); }
    .cross { color:var(--danger); }

    /* ── status ── */
    .status-plat { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .plat-status { display:flex; align-items:center; gap:6px; font-size:.78rem; }
    .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
    .dot-ok { background:var(--success); }
    .dot-err { background:var(--danger); }
    .dot-spin { background:var(--warning); animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── loading ── */
    .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-msg { display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:.88rem; padding:20px; justify-content:center; }

    /* ── misc ── */
    .divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
    .section-title { font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:10px; }
    .tag { font-size:.7rem; padding:1px 6px; border-radius:4px; font-weight:500; }
    .toast { position:fixed; bottom:20px; right:20px; background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius); padding:10px 16px; font-size:.85rem; z-index:999; animation:slideIn .2s; max-width:300px; }
    @keyframes slideIn { from{transform:translateY(10px);opacity:0} to{transform:none;opacity:1} }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>🛒 Comparador de Supermercado</h1>
    <span class="subtitle">iFood vs Rappi</span>
    <a href="/" class="btn btn-ghost btn-sm" style="margin-left:auto">← Voltar</a>
  </div>
</header>

<main class="page">
  <div class="two-col">

    <!-- ── Painel Esquerdo: Lista + Localização ── -->
    <div>

      <!-- Minhas listas -->
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <h2 style="margin:0">Minhas Listas</h2>
          <button class="btn btn-ghost btn-sm" onclick="abrirModalNovaLista()">+ Nova</button>
        </div>
        <div id="listas-container">
          <div class="empty-msg">Carregando...</div>
        </div>
      </div>

      <!-- Lista atual -->
      <div class="card" id="card-lista" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <h2 id="lista-nome" style="margin:0"></h2>
          <button class="btn btn-danger btn-sm" onclick="excluirLista()">Excluir</button>
        </div>
        <p id="lista-descricao" style="font-size:.78rem;color:var(--text-muted);margin-bottom:14px"></p>

        <div class="section-title">Itens da lista</div>
        <div id="items-list" class="items-list">
          <div class="empty-msg">Nenhum item ainda</div>
        </div>

        <!-- Adicionar item -->
        <div class="card-sm">
          <div class="section-title">Adicionar item</div>
          <div class="row-fields">
            <div class="field">
              <label>Item</label>
              <input type="text" id="item-nome" placeholder="ex: Leite" />
            </div>
            <div class="field">
              <label>Qtd</label>
              <input type="number" id="item-qty" value="1" min="0.1" step="0.1" />
            </div>
            <div class="field">
              <label>Un.</label>
              <select id="item-unidade">
                <option>un</option><option>kg</option><option>g</option>
                <option>L</option><option>ml</option><option>cx</option>
                <option>pct</option><option>dz</option>
              </select>
            </div>
          </div>
          <div class="field" style="margin-top:6px">
            <label>Observação (opcional)</label>
            <input type="text" id="item-obs" placeholder="ex: integral, marca X..." />
          </div>
          <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px" onclick="adicionarItem()">+ Adicionar</button>
        </div>

        <hr class="divider" />

        <!-- Localização -->
        <div class="section-title">Localização para busca</div>
        <div class="field">
          <label>CEP</label>
          <input type="text" id="cep" placeholder="00000-000" maxlength="9"
            oninput="this.value=this.value.replace(/\D/g,'').replace(/^(\d{5})(\d)/,'$1-$2')" />
        </div>

        <button class="btn btn-compare" id="btn-comparar" onclick="compararPrecos()">
          🔍 Comparar Preços
        </button>
      </div>
    </div>

    <!-- ── Painel Direito: Resultados ── -->
    <div id="painel-resultado">
      <div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-faint);font-size:.9rem;flex-direction:column;gap:8px">
        <span style="font-size:2rem">🛒</span>
        <span>Selecione uma lista e clique em Comparar Preços</span>
      </div>
    </div>

  </div><!-- /two-col -->
</main>

<!-- Modal nova lista -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center">
  <div class="card" style="width:360px;max-width:95vw">
    <h2>Nova Lista</h2>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="modal-nome" placeholder="ex: Semana 1, Feira do mês..." />
    </div>
    <div class="field">
      <label>Descrição (opcional)</label>
      <input type="text" id="modal-desc" placeholder="ex: compras do mês de abril" />
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="criarLista()">Criar Lista</button>
    </div>
  </div>
</div>

<script>
// ── Estado global ────────────────────────────────────────────────────────────
let listaAtualId = null;
let listaAtualItens = [];

// ── Utils ────────────────────────────────────────────────────────────────────
function moeda(v) {
  return v?.toLocaleString('pt-BR', { style:'currency', currency:'BRL' }) ?? '—';
}
function toast(msg, tipo='info') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = tipo === 'error' ? 'var(--danger)' : tipo === 'success' ? 'var(--success)' : 'var(--accent)';
  el.style.borderLeftWidth = '3px';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
async function api(method, path, body) {
  const r = await fetch(`/api/mercado${path}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.erro || 'Erro desconhecido');
  return data;
}

// ── Listas ───────────────────────────────────────────────────────────────────
async function carregarListas() {
  const listas = await api('GET', '/listas');
  const container = document.getElementById('listas-container');

  if (!listas.length) {
    container.innerHTML = '<div class="empty-msg">Nenhuma lista ainda.<br>Crie a sua primeira lista!</div>';
    return;
  }

  container.innerHTML = listas.map(l => `
    <div class="lista-tab ${l.id === listaAtualId ? 'active' : ''}" onclick="selecionarLista('${l.id}')">
      <span class="lt-name">${l.nome}</span>
      <span class="lt-count">${l.total_itens} item${l.total_itens !== 1 ? 's' : ''}</span>
    </div>
  `).join('');
}

async function selecionarLista(id) {
  listaAtualId = id;
  const lista = await api('GET', `/listas/${id}`);
  listaAtualItens = lista.itens || [];

  document.getElementById('lista-nome').textContent = lista.nome;
  document.getElementById('lista-descricao').textContent = lista.descricao || '';
  document.getElementById('card-lista').style.display = 'block';

  renderizarItens();
  await carregarListas(); // atualiza tab ativa
  await carregarUltimaComparacao();
}

function renderizarItens() {
  const el = document.getElementById('items-list');
  if (!listaAtualItens.length) {
    el.innerHTML = '<div class="empty-msg">Nenhum item ainda</div>';
    return;
  }
  el.innerHTML = listaAtualItens.map(it => `
    <div class="item-row">
      <div>
        <div class="item-name">${it.nome}</div>
        ${it.observacao ? `<div class="item-obs">${it.observacao}</div>` : ''}
      </div>
      <span class="item-qty">${it.quantidade} ${it.unidade}</span>
      <button class="btn btn-danger" onclick="removerItem('${it.id}')">✕</button>
    </div>
  `).join('');
}

function abrirModalNovaLista() {
  const modal = document.getElementById('modal-overlay');
  modal.style.display = 'flex';
  document.getElementById('modal-nome').focus();
}
function fecharModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  document.getElementById('modal-nome').value = '';
  document.getElementById('modal-desc').value = '';
}

async function criarLista() {
  const nome = document.getElementById('modal-nome').value.trim();
  if (!nome) { toast('Informe o nome da lista', 'error'); return; }
  const descricao = document.getElementById('modal-desc').value.trim();
  try {
    const lista = await api('POST', '/listas', { nome, descricao });
    fecharModal();
    await carregarListas();
    selecionarLista(lista.id);
  } catch (e) { toast(e.message, 'error'); }
}

async function excluirLista() {
  if (!confirm('Excluir esta lista e todos os itens?')) return;
  try {
    await api('DELETE', `/listas/${listaAtualId}`);
    listaAtualId = null;
    document.getElementById('card-lista').style.display = 'none';
    document.getElementById('painel-resultado').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-faint);font-size:.9rem;flex-direction:column;gap:8px">
        <span style="font-size:2rem">🛒</span><span>Selecione uma lista</span>
      </div>`;
    await carregarListas();
  } catch (e) { toast(e.message, 'error'); }
}

// ── Itens ─────────────────────────────────────────────────────────────────────
async function adicionarItem() {
  if (!listaAtualId) { toast('Selecione uma lista primeiro', 'error'); return; }
  const nome = document.getElementById('item-nome').value.trim();
  if (!nome) { toast('Informe o nome do item', 'error'); return; }
  const quantidade = parseFloat(document.getElementById('item-qty').value) || 1;
  const unidade = document.getElementById('item-unidade').value;
  const observacao = document.getElementById('item-obs').value.trim();
  try {
    const item = await api('POST', `/listas/${listaAtualId}/itens`, { nome, quantidade, unidade, observacao });
    listaAtualItens.push(item);
    renderizarItens();
    document.getElementById('item-nome').value = '';
    document.getElementById('item-obs').value = '';
    document.getElementById('item-qty').value = '1';
    await carregarListas();
  } catch (e) { toast(e.message, 'error'); }
}

async function removerItem(itemId) {
  try {
    await api('DELETE', `/itens/${itemId}`);
    listaAtualItens = listaAtualItens.filter(i => i.id !== itemId);
    renderizarItens();
    await carregarListas();
  } catch (e) { toast(e.message, 'error'); }
}

// ── Comparação ───────────────────────────────────────────────────────────────
async function compararPrecos() {
  if (!listaAtualId) { toast('Selecione uma lista', 'error'); return; }
  if (!listaAtualItens.length) { toast('Adicione itens à lista antes de comparar', 'error'); return; }

  const cep = document.getElementById('cep').value.replace(/\D/g,'');
  if (cep.length !== 8) { toast('Informe um CEP válido (8 dígitos)', 'error'); return; }

  const btn = document.getElementById('btn-comparar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Buscando preços...';

  const painel = document.getElementById('painel-resultado');
  painel.innerHTML = `
    <div class="card">
      <div class="loading-msg">
        <span class="spinner"></span>
        Consultando iFood e Rappi... isso pode levar até 30 segundos
      </div>
    </div>`;

  try {
    const res = await api('POST', `/listas/${listaAtualId}/comparar`, { cep });
    renderizarResultado(res);
  } catch (e) {
    painel.innerHTML = `<div class="card"><p style="color:var(--danger)">${e.message}</p></div>`;
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔍 Comparar Preços';
  }
}

async function carregarUltimaComparacao() {
  try {
    const res = await api('GET', `/listas/${listaAtualId}/comparacao`);
    renderizarResultado(res, true);
  } catch (_) {
    // sem comparação anterior — ok
  }
}

function renderizarResultado(res, isCache = false) {
  const painel = document.getElementById('painel-resultado');

  if (res.status === 'sem_dados') {
    painel.innerHTML = `
      <div class="card">
        <div class="recomendacao aviso">
          <div class="recomendacao-titulo">⚠ Sem dados</div>
          <div class="recomendacao-msg">Não foi possível obter preços do iFood e Rappi no momento.<br>
          As APIs das plataformas podem estar inacessíveis ou o endereço não tem cobertura.</div>
        </div>
      </div>`;
    return;
  }

  const { recomendacao, cenarios: cen, plataformas, endereco, gerado_em } = res;

  // Status das plataformas
  const statusHtml = `
    <div class="status-plat">
      <div class="plat-status">
        <span class="dot ${plataformas?.ifood === 'ok' ? 'dot-ok' : 'dot-err'}"></span>
        iFood: ${plataformas?.ifood === 'ok' ? 'Online' : 'Indisponível'}
      </div>
      <div class="plat-status">
        <span class="dot ${plataformas?.rappi === 'ok' ? 'dot-ok' : 'dot-err'}"></span>
        Rappi: ${plataformas?.rappi === 'ok' ? 'Online' : 'Indisponível'}
      </div>
      ${endereco ? `<div class="plat-status" style="margin-left:auto;color:var(--text-faint)">📍 ${endereco}</div>` : ''}
    </div>`;

  // Recomendação
  const tipoClass = recomendacao?.plataforma === 'ifood' ? 'ifood'
    : recomendacao?.plataforma === 'rappi' ? 'rappi'
    : recomendacao?.plataforma === 'misto' ? 'misto' : 'aviso';

  const recHtml = recomendacao ? `
    <div class="recomendacao ${tipoClass}">
      <div class="recomendacao-titulo">✅ Recomendação</div>
      <div class="recomendacao-msg">${recomendacao.mensagem}</div>
      ${recomendacao.economia_vs_segundo
        ? `<span class="economia-badge">Economia: ${recomendacao.economia_vs_segundo}</span>` : ''}
    </div>` : '';

  // Cards de cenários
  const melhorTotal = recomendacao?.cenarios?.length
    ? Math.min(...recomendacao.cenarios.map(c => c.total))
    : null;

  const cenariosHtml = recomendacao?.cenarios?.length ? `
    <div class="section-title">Comparativo de cenários</div>
    <div class="cenarios">
      ${recomendacao.cenarios.map(c => {
        const isMelhor = c.total === melhorTotal;
        const platClass = c.plataforma === 'ifood' ? 'badge-ifood'
          : c.plataforma === 'rappi' ? 'badge-rappi' : 'badge-misto';
        const platLabel = c.plataforma === 'ifood' ? 'iFood'
          : c.plataforma === 'rappi' ? 'Rappi' : 'Misto';
        return `
          <div class="cenario-card ${isMelhor ? 'melhor' : ''}">
            ${isMelhor ? '<div class="melhor-tag">Melhor</div>' : ''}
            <span class="plat-badge ${platClass}">${platLabel}</span>
            <div class="cenario-nome">${c.label}</div>
            <div class="cenario-total">${moeda(c.total)}</div>
            <div class="cenario-sub">${c.cobertura_pct}% dos itens • ${c.num_pedidos} pedido${c.num_pedidos > 1 ? 's' : ''}</div>
          </div>`;
      }).join('')}
    </div>` : '';

  // Detalhamento por loja (cenário misto)
  let detalhesHtml = '';
  if (cen?.misto?.itens_por_loja?.length) {
    detalhesHtml = `
      <div class="section-title" style="margin-top:16px">Detalhamento — Compra Dividida</div>
      ${cen.misto.itens_por_loja.map(loja => {
        const platClass = loja.plataforma === 'ifood' ? 'badge-ifood' : 'badge-rappi';
        const platLabel = loja.plataforma === 'ifood' ? 'iFood' : 'Rappi';
        return `
          <div class="loja-section">
            <div class="loja-header">
              <span class="plat-badge ${platClass}">${platLabel}</span>
              <span class="loja-nome">${loja.loja_nome}</span>
              <span class="loja-entrega">Entrega: ${moeda(loja.taxa_entrega)}</span>
              <span class="loja-total">${moeda(loja.subtotal + loja.taxa_entrega)}</span>
            </div>
            <table class="itens-table">
              <thead><tr>
                <th>Item</th><th>Produto</th>
                <th style="text-align:right">Preço un.</th>
                <th style="text-align:right">Qtd</th>
                <th style="text-align:right">Total</th>
              </tr></thead>
              <tbody>
                ${loja.itens.map(i => `
                  <tr>
                    <td>${i.item_nome}</td>
                    <td style="color:var(--text-muted);font-size:.78rem">${i.nome_produto || '—'}</td>
                    <td style="text-align:right" class="price-best">${moeda(i.preco_unitario)}</td>
                    <td style="text-align:right">${i.quantidade} ${i.unidade}</td>
                    <td style="text-align:right;font-weight:600">${moeda(i.preco_total)}</td>
                  </tr>`).join('')}
                <tr style="background:var(--surface-3)">
                  <td colspan="4" style="text-align:right;font-weight:600;color:var(--text-muted)">Subtotal itens:</td>
                  <td style="text-align:right;font-weight:700">${moeda(loja.subtotal)}</td>
                </tr>
                <tr style="background:var(--surface-3)">
                  <td colspan="4" style="text-align:right;font-weight:600;color:var(--text-muted)">Taxa entrega:</td>
                  <td style="text-align:right;font-weight:700">${moeda(loja.taxa_entrega)}</td>
                </tr>
              </tbody>
            </table>
          </div>`;
      }).join('')}
      ${cen.misto.itens_nao_encontrados?.length ? `
        <div class="card-sm" style="border-color:var(--warning);color:var(--warning)">
          ⚠ Itens não encontrados: ${cen.misto.itens_nao_encontrados.map(i => i.nome).join(', ')}
        </div>` : ''}`;
  }

  // Detalhamento melhor iFood / Rappi (quando não há misto)
  const detalheUnicaLoja = (cenarioDados, plat) => {
    if (!cenarioDados?.detalhes) return '';
    const platLabel = plat === 'ifood' ? 'iFood' : 'Rappi';
    const platClass = plat === 'ifood' ? 'badge-ifood' : 'badge-rappi';
    return `
      <div class="section-title" style="margin-top:16px">Detalhamento — ${platLabel} (${cenarioDados.loja?.nome})</div>
      <div class="loja-section">
        <div class="loja-header">
          <span class="plat-badge ${platClass}">${platLabel}</span>
          <span class="loja-nome">${cenarioDados.loja?.nome}</span>
          <span class="loja-entrega">Entrega: ${moeda(cenarioDados.taxa_entrega)}</span>
          <span class="loja-total">${moeda(cenarioDados.total)}</span>
        </div>
        <table class="itens-table">
          <thead><tr><th>Item</th><th>Produto</th><th style="text-align:right">Total</th><th style="text-align:right">Status</th></tr></thead>
          <tbody>
            ${listaAtualItens.map(item => {
              const d = cenarioDados.detalhes?.[item.id];
              return d?.encontrado
                ? `<tr><td>${item.nome}</td><td style="font-size:.78rem;color:var(--text-muted)">${d.nome_produto}</td>
                   <td style="text-align:right" class="price-best">${moeda(d.preco_total)}</td>
                   <td style="text-align:right"><span class="check">✓</span></td></tr>`
                : `<tr><td>${item.nome}</td><td>—</td>
                   <td style="text-align:right" class="not-found">não enc.</td>
                   <td style="text-align:right"><span class="cross">✗</span></td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  };

  const cacheMsg = isCache && gerado_em
    ? `<div style="text-align:right;font-size:.72rem;color:var(--text-faint);margin-bottom:8px">Última comparação: ${new Date(gerado_em).toLocaleString('pt-BR')}</div>`
    : '';

  painel.innerHTML = `
    <div class="card">
      ${cacheMsg}
      ${statusHtml}
      ${recHtml}
      ${cenariosHtml}
      ${detalhesHtml || detalheUnicaLoja(cen?.melhor_ifood, 'ifood') || detalheUnicaLoja(cen?.melhor_rappi, 'rappi')}
    </div>`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  carregarListas();

  // Enter no nome do item adiciona
  document.getElementById('item-nome').addEventListener('keydown', e => {
    if (e.key === 'Enter') adicionarItem();
  });

  // Enter no modal cria lista
  document.getElementById('modal-nome').addEventListener('keydown', e => {
    if (e.key === 'Enter') criarLista();
  });

  // Fecha modal clicando fora
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) fecharModal();
  });
});
</script>
</body>
</html>
