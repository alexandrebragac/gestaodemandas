<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Gestão de Demandas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo h1 { font-size: 1.4rem; color: var(--text); margin: 0 0 4px; }
    .login-logo p  { font-size: .85rem; color: var(--text-muted); margin: 0; }
    .login-box label { display: block; font-size: .78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; margin-top: 14px; }
    .login-box input {
      width: 100%; padding: 11px 13px; background: var(--surface-3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: .95rem; font-family: inherit; box-sizing: border-box;
    }
    .login-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn-login {
      width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 20px;
      font-family: inherit; transition: background .15s;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }
    .login-error { color: var(--danger); font-size: .85rem; text-align: center; margin-top: 12px; min-height: 20px; }
    .login-setup { margin-top: 18px; text-align: center; font-size: .8rem; color: var(--text-muted); }
    .login-setup a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <h1>📋 Gestão de Demandas</h1>
      <p>Entre com seu email e senha</p>
    </div>

    <label for="login-email">Email</label>
    <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email" />

    <label for="login-senha">Senha</label>
    <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" />

    <button class="btn-login" id="btn-entrar">Entrar</button>
    <div class="login-error" id="login-error"></div>

    <div class="login-setup">
      Primeiro acesso? Peça ao administrador para definir sua senha.
    </div>
  </div>

  <script>
    const AUTH_KEY = 'gestao_auth';

    // Se já está logado, redireciona
    try {
      const existing = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      if (existing?.token) {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      }
    } catch (_) {}

    const emailEl = document.getElementById('login-email');
    const senhaEl = document.getElementById('login-senha');
    const btnEl   = document.getElementById('btn-entrar');
    const errEl   = document.getElementById('login-error');

    async function fazerLogin() {
      errEl.textContent = '';
      const email = emailEl.value.trim();
      const senha = senhaEl.value;
      if (!email || !senha) { errEl.textContent = 'Preencha email e senha.'; return; }

      btnEl.disabled = true;
      btnEl.textContent = 'Entrando...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.erro || 'Erro ao entrar.'; return; }

        localStorage.setItem(AUTH_KEY, JSON.stringify({ token: data.token, usuario: data.usuario }));
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      } catch (e) {
        errEl.textContent = 'Erro de conexão. Verifique o servidor.';
      } finally {
        btnEl.disabled = false;
        btnEl.textContent = 'Entrar';
      }
    }

    btnEl.addEventListener('click', fazerLogin);
    senhaEl.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
  </script>
</body>
</html>
